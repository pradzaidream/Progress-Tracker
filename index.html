function pd(s){var a=s.split('-');return new Date(+a[0],a[1]-1,+a[2],12);}

function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return fd(d);}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5);}

function short(s){var d=pd(s);return MN[d.getMonth()]+' '+d.getDate();}

/* ---------------- program logic ---------------- */
function phaseOf(s){for(var i=0;i<PHASES.length;i++)if(inR(s,PHASES[i].start,PHASES[i].end))return PHASES[i];return s<START?PHASES[0]:PHASES[3];}
function deloadOf(s){for(var i=0;i<DELOADS.length;i++)if(inR(s,DELOADS[i][0],DELOADS[i][1]))return DELOADS[i][2];return '';}
function weekNo(s){var mon0='2026-11-30';return Math.floor(diff(mon0,s)/7)+1;}
function isMatch(s){var p=S.profile;if(!p.matchesOn||!p.firstMatch)return false;if(s<p.firstMatch)return false;
  return diff(p.firstMatch,s)%(+p.matchEvery||14)===0;}
function baseType(s){
  var dow=pd(s).getDay(), c2=S.profile.cricket2;
  if(c2!=='none'&&DN[dow]===c2)return 'cricket';
  return ({1:'lowerA',2:'cricket',3:'upperB',4:'speed',5:'powerC',6:'skills',0:'rest'})[dow];
}
function autoType(s){
  if(isMatch(s))return 'match';
  if(isMatch(addD(s,1)))return 'primer';
  if(isMatch(addD(s,-1)))return 'recovery';
  return baseType(s);
}
function dayType(s){if(s<START||s>END)return null;return S.overrides[s]||autoType(s);}
function targetWeight(s){
  if(s<=MILESTONES[0][0])return MILESTONES[0][1];
  for(var i=1;i<MILESTONES.length;i++){var a=MILESTONES[i-1],b=MILESTONES[i];
    if(s<=b[0]){var f=diff(a[0],s)/diff(a[0],b[0]);return a[1]+(b[1]-a[1])*f;}}
  return MILESTONES[MILESTONES.length-1][1];
}
function wDates(){return Object.keys(S.weights).sort();}
function avg7(s){var ks=wDates().filter(function(k){return k<=s&&k>addD(s,-7);});if(!ks.length)return null;
  return ks.reduce(function(t,k){return t+S.weights[k];},0)/ks.length;}
function latestW(s){var ks=wDates().filter(function(k){return k<=s;});return ks.length?S.weights[ks[ks.length-1]]:null;}
function refWeight(s){return avg7(s)||latestW(s)||S.profile.startWeight;}
function targets(s,type){
  var p=S.profile, w=refWeight(s), kg=w/2.2046, cm=p.heightIn*2.54;
  var bmr=10*kg+6.25*cm-5*p.age+(p.sex==='F'?-161:5);
  var tdee=bmr*(+p.activity||1.5);
  var ph=phaseOf(s), t=TEMPLATES[type||'rest'];
  var kcal=Math.max(1800,Math.round((tdee-ph.deficit+t.adj)/10)*10);
  var pro=+p.protein||195, fat=Math.round(w*0.3), carb=Math.max(80,Math.round((kcal-pro*4-fat*9)/4));
  return {kcal:kcal,pro:pro,fat:fat,carb:carb,tdee:Math.round(tdee),deficit:ph.deficit};
}
function wLog(s){return S.workouts[s]||(S.workouts[s]={done:{},load:{},rpe:'',notes:'',complete:false,stats:{}});}
function itemCount(type){return TEMPLATES[type].blocks.reduce(function(t,b){return t+b.items.length;},0);}
function workoutDone(s){var w=S.workouts[s];if(!w)return false;if(w.complete)return true;
  var t=dayType(s);if(!t)return false;var n=itemCount(t),d=0;for(var k in w.done)if(w.done[k])d++;return n>0&&d/n>=0.7;}
function dietScore(s){var d=S.diet[s];if(!d||!d.c)return null;var n=0,any=false;DIET_CHECKS.forEach(function(c){if(d.c[c[0]])n++;if(c[0] in d.c)any=true;});
  return any?Math.round(n/DIET_CHECKS.length*100):null;}
function isTraining(t){return t&&t!=='rest';}

   meal('Pre-session (60–90 min before)',20,['Banana + 3 dates + 200 g Greek yogurt','PB toast (1 tbsp) + whey'])+
   meal('Dinner (post-session)',50,['Grilled fish or chicken 220 g · 1 cup rice or potatoes · dal · veg','Egg curry (4 eggs, 2 whites) · 2 roti · sabzi'])+
   '<p class="sm mut">Night before a match: lean on rice or potatoes at dinner, no alcohol, nothing deep-fried.</p>';
  if(k==='match')return '<p class="sm mut">Fuel to perform. This is the one day the cut takes a back seat.</p>'+
   meal('Breakfast (3h before)',40,['Poha or upma (1.5 cups) + 3 egg whites + 2 eggs','Oats + whey + banana + honey · coffee'])+
   meal('During play',0,['500 ml fluid + electrolytes at every drinks break','Innings break: banana + PB sandwich, or dates + a granola bar','Avoid heavy, fried or greasy food during the game'])+
   meal('Within 1h after',40,['Whey shake + fruit','Chocolate milk 500 ml + 1 scoop whey'])+
   meal('Dinner',50,['Chicken biryani portion (1.5 cups) + raita + salad, eaten mindfully','Grilled chicken/fish 220 g + rice + veg'])+
   '<p class="sm mut">Team food after the game: protein first, one plate, then stop. A beer counts toward the 3-a-week cap.</p>';
  return '<p class="sm mut">Rest and recovery days. Keep protein the same and cut back on carbs.</p>'+
   meal('Breakfast',45,['Egg-white veggie omelette (1 cup whites + 2 eggs) · fruit','Greek yogurt 250 g + whey + berries'])+
   meal('Lunch',45,['Big salad: 200 g grilled chicken, chickpeas ½ cup, veg, lemon-yogurt dressing','Chicken or fish tikka + kachumber + 1 roti'])+
   meal('Snack',30,['Protein shake or 200 g Greek yogurt','Roasted chana 30 g + 1 boiled egg'])+
   meal('Dinner',45,['Fish or chicken 200 g · double sabzi · dal ½ cup · no rice','Tofu / paneer stir-fry with lots of veg · cauliflower rice']);
}

function chart(){
  var W=340,H=190,pl=30,pr=8,pt=10,pb=22, x0=pd(START),x1=pd(END), span=x1-x0;
  var ks=wDates().filter(function(k){return k>=addD(START,-21)&&k<=END;});
  var ys=ks.map(function(k){return S.weights[k];}).concat([226,188]);
  var ymin=Math.floor(Math.min.apply(null,ys)-1), ymax=Math.ceil(Math.max.apply(null,ys)+1);
  function X(s){return pl+Math.max(0,Math.min(1,(pd(s)-x0)/span))*(W-pl-pr);}
  function Y(v){return pt+(ymax-v)/(ymax-ymin)*(H-pt-pb);}
  var g='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Weight vs target">';
  for(var v=Math.ceil(ymin/5)*5;v<=ymax;v+=5)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#2a4378" stroke-width="0.6"/><text x="'+(pl-4)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>';
  ['2026-12-01','2027-01-01','2027-02-01','2027-03-01','2027-04-01'].forEach(function(m){g+='<text x="'+X(m)+'" y="'+(H-6)+'" text-anchor="middle">'+MN[pd(m).getMonth()]+'</text>';});
  g+='<line x1="'+X(SEASON)+'" x2="'+X(SEASON)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#ff7a1a" stroke-dasharray="3 3" stroke-width="0.8"/><text x="'+(X(SEASON)+3)+'" y="'+(pt+8)+'" style="fill:#ffa45c">League</text>';
  g+='<polyline fill="none" stroke="#9fb0d0" stroke-dasharray="4 3" stroke-width="1.2" points="'+MILESTONES.map(function(m){return X(m[0])+','+Y(m[1]);}).join(' ')+'"/>';
  MILESTONES.forEach(function(m){g+='<circle cx="'+X(m[0])+'" cy="'+Y(m[1])+'" r="2.2" fill="#9fb0d0"/>';});
  ks.forEach(function(k){if(k>=START)g+='<circle cx="'+X(k)+'" cy="'+Y(S.weights[k])+'" r="1.8" fill="#9fb0d0" opacity=".55"/>';});
  var av=ks.filter(function(k){return k>=START;}).map(function(k){return X(k)+','+Y(avg7(k));});
  if(av.length>1)g+='<polyline fill="none" stroke="#ff7a1a" stroke-width="2.2" stroke-linejoin="round" points="'+av.join(' ')+'"/>';
  else if(av.length===1)g+='<circle cx="'+av[0].split(',')[0]+'" cy="'+av[0].split(',')[1]+'" r="3" fill="#ff7a1a"/>';
  return g+'</svg><div class="legend sm" style="margin-top:4px"><span style="color:#ff7a1a">━ 7-day avg</span><span class="mut">┅ target line</span><span class="mut">• daily weigh-ins</span></div>';
}
function weekRows(){
  var rows=[], wk='2026-11-30', t=todayS();
  while(wk<=END&&wk<=t){var planned=0,done=0,sc=[],last=null;
    for(var i=0;i<7;i++){var s=addD(wk,i),ty=dayType(s);if(!ty||s>t)continue;if(isTraining(ty)){planned++;if(workoutDone(s))done++;}
      var d=dietScore(s);if(d!=null)sc.push(d);}
    var end=addD(wk,6), a=avg7(end>t?t:end);
    rows.push({wk:weekNo(wk),start:wk,avg:a,target:targetWeight(end>END?END:end),planned:planned,done:done,diet:sc.length?Math.round(sc.reduce(function(x,y){return x+y;},0)/sc.length):null,logged:sc.length});
    wk=addD(wk,7);}
  return rows;
}
function projection(){
  var t=todayS(), ks=wDates().filter(function(k){return k>=addD(t,-28)&&k<=t;});
  if(ks.length<6)return null;
  var a=avg7(ks[ks.length-1]), b=avg7(addD(ks[ks.length-1],-14));
  if(a==null||b==null)return null;
  var rate=(b-a)/2; var weeksLeft=Math.max(0,diff(ks[ks.length-1],END)/7);
  return {rate:rate,landing:a-rate*weeksLeft};
}
function vProgress(){
  var t=todayS(), ref=refDay(), p=S.profile, a=avg7(ref)||latestW(ref), pj=projection(), rows=weekRows();
  var wkDone=0,wkPlan=0;rows.forEach(function(r){wkDone+=r.done;wkPlan+=r.planned;});
  var ds=[];for(var i=0;i<7;i++){var d=dietScore(addD(ref,-i));if(d!=null)ds.push(d);}
  var d7=ds.length?Math.round(ds.reduce(function(x,y){return x+y;},0)/ds.length):null;
  var lost=a?p.startWeight-a:0, pct=Math.max(0,Math.min(100,lost/(p.startWeight-p.goalWeight)*100));
  var h='<div class="card"><h2>Progress</h2><div class="bar" style="margin:6px 0 4px"><i style="width:'+pct.toFixed(0)+'%"></i></div><div class="sm mut">'+lost.toFixed(1)+' of '+(p.startWeight-p.goalWeight)+' lb · '+Math.max(0,diff(t,END))+' days left · league starts in '+Math.max(0,diff(t,SEASON))+' days</div>'+
   '<div class="grid" style="margin-top:10px"><div class="kpi"><div class="v">'+(a?a.toFixed(1):'—')+'</div><div class="l">Current (7-day avg)</div></div>'+
   '<div class="kpi"><div class="v">'+targetWeight(ref).toFixed(1)+'</div><div class="l">Target line today</div></div>'+
   '<div class="kpi"><div class="v">'+(pj?pj.rate.toFixed(1):'—')+'</div><div class="l">lb/week (last 2 wks)</div></div>'+
   '<div class="kpi"><div class="v">'+(pj?pj.landing.toFixed(0):'—')+'</div><div class="l">Projected Apr 27</div></div>'+
   '<div class="kpi"><div class="v">'+wkDone+'/'+wkPlan+'</div><div class="l">Sessions done</div></div>'+
   '<div class="kpi"><div class="v">'+(d7==null?'—':d7+'%')+'</div><div class="l">Diet adherence (7d)</div></div></div>'+
   '<div style="margin-top:12px">'+chart()+'</div></div>';
  h+='<div class="card"><h2>Weekly log</h2>'+(rows.length?'<table><tr><th>Week</th><th>Avg</th><th>Target</th><th>Sessions</th><th>Diet</th></tr>'+rows.slice().reverse().map(function(r){
    var c=r.avg==null?'':(r.avg<=r.target+0.5?'okc':r.avg<=r.target+2.5?'warnc':'badc');
    return '<tr><td>Wk '+r.wk+' <span class="mut sm">'+short(r.start)+'</span></td><td class="'+c+'">'+(r.avg?r.avg.toFixed(1):'—')+'</td><td>'+r.target.toFixed(1)+'</td><td>'+r.done+'/'+r.planned+'</td><td>'+(r.diet==null?'—':r.diet+'%')+'</td></tr>';}).join('')+'</table>':'<p class="mut sm">Weekly rows appear once the program starts on Dec 1.</p>')+'</div>';
  h+='<div class="card"><h2>Weigh-in history</h2>'+weighList()+'</div>';
  h+='<div class="card"><h2>Report</h2><p class="sm mut">A plain-text summary to send to a trainer or teammate.</p><pre class="rep" id="rep">'+esc(report())+'</pre><div class="row"><button data-act="copyrep">Copy report</button></div></div>';
  return h;
}
function weighList(){var ks=wDates().reverse();if(!ks.length)return '<p class="mut sm">No weigh-ins yet.</p>';
  return '<table><tr><th>Date</th><th>Weight</th><th>7-day avg</th><th>Target</th></tr>'+ks.slice(0,60).map(function(k){var av=avg7(k);
    return '<tr><td>'+nice(k)+'</td><td>'+S.weights[k].toFixed(1)+'</td><td>'+(av?av.toFixed(1):'—')+'</td><td>'+targetWeight(k).toFixed(1)+'</td></tr>';}).join('')+'</table>'+(ks.length>60?'<p class="sm mut">Showing the latest 60.</p>':'');}
function refDay(){var t=todayS();return t<START?START:(t>END?END:t);}
function report(){
  var t=todayS(), ref=refDay(), a=avg7(ref), p=S.profile, pj=projection(), rows=weekRows().slice(-4);
  var L=['SEASON CUT — '+nice(t),'Goal: '+p.startWeight+' → '+p.goalWeight+' lb by Apr 27, 2027 · League starts mid-March','Phase: '+phaseOf(ref).name+' (week '+weekNo(ref)+')',
   'Current 7-day avg: '+(a?a.toFixed(1):'n/a')+' lb · target line: '+targetWeight(ref).toFixed(1)+' lb',
   'Rate (last 2 weeks): '+(pj?pj.rate.toFixed(2)+' lb/wk · projected landing '+pj.landing.toFixed(1)+' lb':'not enough data'),'','Last 4 weeks:'];
  rows.forEach(function(r){L.push('  Wk '+r.wk+' ('+short(r.start)+'): avg '+(r.avg?r.avg.toFixed(1):'—')+' / target '+r.target.toFixed(1)+' · sessions '+r.done+'/'+r.planned+' · diet '+(r.diet==null?'—':r.diet+'%'));});
  var lifts={};Object.keys(S.workouts).sort().forEach(function(s){var w=S.workouts[s],ty=dayType(s);if(!ty||!w.load)return;var idx=0;
    TEMPLATES[ty].blocks.forEach(function(b){b.items.forEach(function(e){var v=w.load[idx++];if(v)lifts[e.n]=v+' ('+short(s)+')';});});});
  var lk=Object.keys(lifts);if(lk.length){L.push('','Latest logged loads:');lk.forEach(function(k){L.push('  '+k+': '+lifts[k]);});}
  var m=Object.keys(S.workouts).filter(function(s){return dayType(s)==='match'&&S.workouts[s].stats&&(S.workouts[s].stats.runs||S.workouts[s].stats.catches||S.workouts[s].stats.stumpings);}).sort();
  if(m.length){var R=0,B=0,C=0,St=0;m.forEach(function(s){var x=S.workouts[s].stats;R+=+x.runs||0;B+=+x.balls||0;C+=+x.catches||0;St+=+x.stumpings||0;});
    L.push('','Matches logged: '+m.length+' · runs '+R+(B?' (SR '+(R/B*100).toFixed(0)+')':'')+' · catches '+C+' · stumpings '+St);}
  return L.join('\n');
}

function vSetup(){
  var p=S.profile, hf=Math.floor(p.heightIn/12), hi=Math.round(p.heightIn%12);
  var h='<div class="card"><h2>Your profile</h2><p class="sm mut">Used for the calorie targets.</p><div class="grid">'+
   '<label class="sm mut">Height ft<br><input type="number" data-p="hft" value="'+hf+'"></label><label class="sm mut">Height in<br><input type="number" data-p="hin" value="'+hi+'"></label>'+
   '<label class="sm mut">Age<br><input type="number" data-p="age" value="'+p.age+'"></label>'+
   '<label class="sm mut">Sex<br><select data-p="sex"><option value="M"'+(p.sex==='M'?' selected':'')+'>Male</option><option value="F"'+(p.sex==='F'?' selected':'')+'>Female</option></select></label>'+
   '<label class="sm mut">Start weight<br><input type="number" step="0.1" data-p="startWeight" value="'+p.startWeight+'"></label>'+
   '<label class="sm mut">Protein g/day<br><input type="number" data-p="protein" value="'+p.protein+'"></label>'+
   '<label class="sm mut">Activity factor<br><select data-p="activity">'+[[1.4,'1.4 · desk job, light'],[1.5,'1.5 · desk + 5–6 sessions'],[1.6,'1.6 · active job + training'],[1.7,'1.7 · very active']].map(function(o){return '<option value="'+o[0]+'"'+(+p.activity===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label></div>'+
   '<div class="row" style="margin-top:10px"><button class="pri" data-act="confirm">'+(p.confirmed?'Saved':'Confirm profile')+'</button><span class="sm mut">Maintenance today ≈ '+targets(UI.date,'lowerA').tdee+' kcal</span></div></div>';
  h+='<div class="card"><h2>Cricket schedule</h2>'+
   '<label class="chk"><input type="checkbox" data-p="matchesOn"'+(p.matchesOn?' checked':'')+'><span>Matches every other weekend (adds a primer the day before and recovery the day after)</span></label>'+
   '<div class="grid" style="margin-top:6px"><label class="sm mut">First match date<br><input type="date" data-p="firstMatch" value="'+p.firstMatch+'"></label>'+
   '<label class="sm mut">Repeat every<br><select data-p="matchEvery">'+[[7,'Week'],[14,'2 weeks'],[21,'3 weeks']].map(function(o){return '<option value="'+o[0]+'"'+(+p.matchEvery===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label>'+
   '<label class="sm mut">2nd cricket session<br><select data-p="cricket2">'+[['none','None (1 a week)'],['Thu','Thursday'],['Fri','Friday'],['Sat','Saturday'],['Sun','Sunday']].map(function(o){return '<option value="'+o[0]+'"'+(p.cricket2===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></label></div>'+
   '<p class="sm mut">Tuesday is the default net session. For a one-off change (a match moved to Sunday, a washed-out net), open that day and use its session menu. '+Object.keys(S.overrides).length+' day(s) changed.</p>'+
   (Object.keys(S.overrides).length?'<button class="ghost" data-act="clearOv">Undo all day changes</button>':'')+'</div>';
  h+='<div class="card"><h2>Backup</h2><p class="sm mut">Your logs save into this page. Keep an occasional backup file anyway.</p><div class="row">'+
   '<button data-act="export">Download backup (.json)</button><button data-act="csv">Download weights (.csv)</button>'+
   '<label class="btn">Restore backup<input type="file" accept=".json,application/json" data-f="import" class="hide"></label></div>'+
   '<div class="row" style="margin-top:12px"><button class="ghost" data-act="copyjson">Copy backup to clipboard</button><button class="ghost badc" data-act="reset">Reset all data…</button></div><div id="resetbox"></div></div>';
  return h;
}

/* ---------------- events ---------------- */
function onClick(e){
  var el=e.target.closest('[data-tab],[data-act]');if(!el)return;
  if(el.dataset.tab){e.preventDefault();go(el.dataset.tab);return;}
  var a=el.dataset.act;
  if(a==='day'){UI.date=addD(UI.date,+el.dataset.n);if(UI.date<addD(START,-30))UI.date=addD(START,-30);if(UI.date>END)UI.date=END;render();}
  else if(a==='gotoday'){UI.date=todayS();if(UI.date>END)UI.date=END;render();}
  else if(a==='open'){UI.date=el.dataset.d;go('today');}
  else if(a==='saveW'){var v=parseFloat(document.getElementById('wIn').value);if(!(v>80&&v<400)){toast('Enter a weight in lb');return;}
    S.weights[UI.date]=Math.round(v*10)/10;save();render();toast('Weight saved');}
  else if(a==='delW'){delete S.weights[UI.date];save();render();}
  else if(a==='dtab'){UI.dietTab=el.dataset.k;render();}
  else if(a==='sync'){clearTimeout(pubTimer);publish();}
  else if(a==='confirm'){S.profile.confirmed=true;save();render();toast('Profile saved');}
  else if(a==='clearOv'){S.overrides={};save();render();}
  else if(a==='copyrep'){copy(report());}
  else if(a==='copyjson'){copy(JSON.stringify(S));}
  else if(a==='export'){dl('season-cut-backup-'+todayS()+'.json',JSON.stringify(S,null,1),'application/json');}
  else if(a==='csv'){dl('season-cut-weights.csv','date,weight,avg7,target\n'+wDates().map(function(k){return k+','+S.weights[k]+','+(avg7(k)||'').toString().slice(0,6)+','+targetWeight(k).toFixed(1);}).join('\n'),'text/csv');}
  else if(a==='reset'){document.getElementById('resetbox').innerHTML='<div class="banner" style="margin-top:10px">This deletes every log on this page. <button class="pri" data-act="reset2">Yes, reset</button> <button class="ghost" data-act="reset0">Cancel</button></div>';}
  else if(a==='reset0'){document.getElementById('resetbox').innerHTML='';}
  else if(a==='reset2'){S=clone(DEFAULT);save();render();toast('Reset');}
}
function copy(t){try{navigator.clipboard.writeText(t).then(function(){toast('Copied');},function(){toast('Copy blocked — select the text instead');});}catch(e){toast('Copy blocked');}}
var DLS=null;
function dl(name,data,mime){
  if(!DLS){toast('Downloads unavailable here — use Copy');return;}
  Promise.resolve().then(function(){return DLS.save({filename:name,data:data,mimeType:mime});}).then(function(){},function(){toast('Download cancelled');});
}
function onChange(e){
  var el=e.target, f=el.dataset.f, pk=el.dataset.p, s=UI.date;
  if(pk){var p=S.profile;
    if(pk==='hft'||pk==='hin'){var ft=+document.querySelector('[data-p=hft]').value||0,inch=+document.querySelector('[data-p=hin]').value||0;if(ft*12+inch>48)p.heightIn=ft*12+inch;}
    else if(pk==='matchesOn')p.matchesOn=el.checked;
    else if(pk==='sex'||pk==='firstMatch'||pk==='cricket2')p[pk]=el.value;
    else{var v=parseFloat(el.value);if(!isNaN(v))p[pk]=v;}
    save();render();return;}
  if(!f)return;
  if(f==='import'){var file=el.files&&el.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!o.profile)throw 0;S=merge(clone(DEFAULT),o);save();render();toast('Backup restored');}catch(x){toast('That file isn\'t a backup from this tracker');}};r.readAsText(file);return;}
  if(f==='override'){if(el.value===autoType(s))delete S.overrides[s];else S.overrides[s]=el.value;
    if(S.workouts[s]){S.workouts[s].done={};S.workouts[s].load={};}save();render();return;}
  var w;
  if(f==='ex'){w=wLog(s);w.done[el.dataset.i]=el.checked;}
  else if(f==='load'){w=wLog(s);w.load[el.dataset.i]=el.value.trim();}
  else if(f==='stat'){w=wLog(s);w.stats=w.stats||{};w.stats[el.dataset.k]=el.value.trim();}
  else if(f==='rpe'){wLog(s).rpe=el.value;}
  else if(f==='complete'){wLog(s).complete=el.checked;}
  else if(f==='wnotes'){wLog(s).notes=el.value;}
  else if(f==='dc'||f==='kcal'||f==='prot'){var D=S.diet[s]||(S.diet[s]={c:{}});D.c=D.c||{};
    if(f==='dc')D.c[el.dataset.k]=el.checked;else D[f]=el.value;
    if(f==='kcal'&&el.value){var tg=targets(s,dayType(s)||'rest');D.c.cal=Math.abs(+el.value-tg.kcal)<=150;}
    if(f==='prot'&&el.value){D.c.pro=+el.value>=180;}
    DIET_CHECKS.forEach(function(c){if(!(c[0] in D.c))D.c[c[0]]=false;});}
  save();
  var y=window.scrollY;render();window.scrollTo(0,y);
}
document.addEventListener('click',onClick);
document.addEventListener('change',onChange);
window.addEventListener('hashchange',function(){var h=location.hash.replace('#','');if(TABS.some(function(x){return x[0]===h;})&&h!==UI.tab){UI.tab=h;render();}});

initUI();render();
if(UI.y)setTimeout(function(){window.scrollTo(0,UI.y);},30);
var attached=false, tries=0;
function attach(){
  if(attached)return;
  if(window.claude&&typeof window.claude.use==='function'){attached=true;
    window.claude.use('artifact').then(function(a){ART=a;artTried=true;renderSync();if(ART&&acted&&dirty){pubTimer=setTimeout(publish,1500);}},function(){artTried=true;renderSync();});
    window.claude.use('downloads').then(function(d){DLS=d;},function(){});
  }else if(++tries<12){setTimeout(attach,500);}else{artTried=true;renderSync();}
}
attach();
window.__app={S:function(){return S;},dayType:dayType,targets:targets,buildDoc:buildDoc,targetWeight:targetWeight,report:report,UI:UI,render:render};
})();
